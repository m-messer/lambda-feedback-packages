[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "lambdafeedback-criteria"
version = "0.2.0"
description = "Criteria DSL parser and evaluation graph extracted from compareExpressions."
requires-python = ">=3.11"
dependencies = [
    "lambdafeedback-slr-parsing (>=0.2.0,<0.3.0)",
]

[tool.poetry]
packages = [{ include = "lambdafeedback/criteria", from = "src" }]

# Resolve sibling packages from the monorepo during development; published
# metadata keeps the plain requirements from [project.dependencies].
[tool.poetry.dependencies]
lambdafeedback-slr-parsing = { path = "../slr_parsing", develop = true }
